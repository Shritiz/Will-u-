
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Super Tic-Tac-Toe</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="app">
			<h1>Super Tic-Tac-Toe</h1>

			<div class="controls">
				<div id="status" class="status">Player X's turn</div>
				<div class="buttons">
					<button id="resetBtn">Reset</button>
				</div>
			</div>

			<div id="board" class="big-board" aria-label="Super Tic Tac Toe board"></div>

			<p class="hint">Play by clicking a cell. Your move sends the opponent to that mini-board.</p>
		</div>

		<script src="script.js"></script>
	</body>
</html>
